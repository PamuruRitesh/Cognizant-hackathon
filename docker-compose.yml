services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - STOCKPILOT_DATA_DIR=/app/mocks
    volumes:
      - ./mocks:/app/mocks
      - ./cache:/app/cache

  ui:
    build: .
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - STOCKPILOT_API_BASE=http://api:8000/api
    depends_on:
      - api
