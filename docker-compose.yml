services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - STOCKPILOT_DATA_DIR=/app/mocks
    volumes:
      - ./mocks:/app/mocks
      - ./cache:/app/cache

  ui:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://api:8000/api
    depends_on:
      - api
